name: Angel One Index Data Validation

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "Completed NSE/BSE trading date (YYYY-MM-DD); leave blank for previous weekday"
        required: false
        type: string
      websocket_probe:
        description: "Run the short live WebSocket probe (best during market hours)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: angel-index-validation
  cancel-in-progress: false

jobs:
  validate-index-data:
    name: Validate NIFTY, BANKNIFTY and SENSEX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify required secrets are configured
        shell: bash
        run: |
          missing=0
          for name in ANGEL_API_KEY ANGEL_CLIENT_CODE ANGEL_PIN ANGEL_TOTP_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Run read-only index data validation
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          WEBSOCKET_PROBE: ${{ inputs.websocket_probe }}
        shell: bash
        run: |
          args=()
          if [[ -n "$SESSION_DATE" ]]; then
            args+=(--date "$SESSION_DATE")
          fi
          if [[ "$WEBSOCKET_PROBE" != "true" ]]; then
            args+=(--skip-websocket)
          fi
          python scripts/validate_angel_index_data.py "${args[@]}"

      - name: Upload sanitized validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angel-index-validation-report
          path: data/reports/angel_index_validation_*.json
          if-no-files-found: ignore
          retention-days: 7
