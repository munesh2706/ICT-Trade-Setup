name: ICT Engine Tests

on:
  pull_request:
    branches: [main, fix/historical-candle-gap-audit]
  push:
    branches: [main, "feature/ict-2022-model-engine"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run deterministic ICT engine tests
        run: python -m pytest -q
